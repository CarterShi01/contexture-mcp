      <rect class="member" x="382" y="531" width="216" height="48" rx="8"/>
      <text x="258" y="562" font-size="23" class="center accent">Skill · procedure</text>
      <text x="490" y="562" font-size="23" class="center accent">Tool · action</text>

      <rect id="left-child-role" class="role-shell" x="150" y="597" width="448" height="155" rx="10"/>
      <g data-within="left-child-role">
        <path class="role-heading" d="M162 599h424q10 0 10 10v31H152v-31q0-10 10-10Z"/>
        <path class="role-divider" d="M152 640h444"/>
        <text x="168" y="627" font-size="26" font-weight="650" class="accent">Child Role</text>
        <rect class="guidance" x="166" y="650" width="416" height="36" rx="7"/>
        <text x="374" y="675" font-size="22" class="center">Local guidance</text>
        <rect class="member" x="166" y="699" width="128" height="37" rx="7"/>
        <rect class="member" x="310" y="699" width="128" height="37" rx="7"/>
        <rect class="node" x="454" y="699" width="128" height="37" rx="7"/>
        <text x="230" y="725" font-size="22" class="center accent">Skill</text>
        <text x="374" y="725" font-size="22" class="center accent">Tool</text>
        <text x="518" y="724" font-size="20" class="center muted">Child Role…</text>
      </g>
    </g>
  </g>

  <rect id="right-panel" class="panel" x="700" y="313" width="804" height="485" rx="16"/>
  <g data-within="right-panel">
    <text x="734" y="361" class="panel-heading accent">Application capability graph</text>

