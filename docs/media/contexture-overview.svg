<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="cover-title cover-description"><style>
    :root {
      color-scheme: light;
      --cp-bg: #f7f4ef;
      --cp-bg-elevated: #fcfbf8;
      --cp-surface: #ffffff;
      --cp-surface-soft: #f5f5f5;
      --cp-border: #dedede;
      --cp-border-strong: #919191;
      --cp-text: #242424;
      --cp-text-muted: #5c5c5c;
      --cp-text-soft: #6f6f6f;
      --cp-accent: #b11f4b;
      --cp-accent-hover: #9a1a41;
      --cp-accent-soft: rgba(177, 31, 75, 0.08);
      --cp-accent-fg: #ffffff;
      --cp-success: #16a34a;
      --cp-danger: #dc2626;
      --cp-warning: #f59e0b;
      --cp-link: #0078d4;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
      --cp-overlay: rgba(255, 255, 255, 0.8);
      --cp-panel: rgba(255, 255, 255, 0.86);
      --cp-panel-strong: rgba(255, 255, 255, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.55);
      --cp-highlight: rgba(177, 31, 75, 0.12);
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --cp-bg: #3d3b3a;
      --cp-bg-elevated: #343231;
      --cp-surface: #292929;
      --cp-surface-soft: #2e2e2e;
      --cp-border: #474747;
      --cp-border-strong: #5f5f5f;
      --cp-text: #dedede;
      --cp-text-muted: #919191;
      --cp-text-soft: #b0b0b0;
      --cp-accent: #fd8ea1;
      --cp-accent-hover: #fb7b91;
      --cp-accent-soft: rgba(253, 142, 161, 0.14);
      --cp-accent-fg: #1a1a1a;
      --cp-success: #4ade80;
      --cp-danger: #f87171;
      --cp-warning: #fbbf24;
      --cp-link: #4da6ff;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
      --cp-overlay: rgba(41, 41, 41, 0.88);
      --cp-panel: rgba(41, 41, 41, 0.72);
      --cp-panel-strong: rgba(41, 41, 41, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.04);
      --cp-highlight: rgba(253, 142, 161, 0.12);
    }


    * { box-sizing: border-box; }
    body { margin: 0; background: var(--cp-bg); }
    svg { display: block; width: 100%; max-width: 1600px; height: auto; margin: 0 auto; }
    text { font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif; fill: var(--cp-text); }
    .canvas { fill: var(--cp-bg); }
    .brand-rule { fill: var(--cp-accent); }
    .headline { font-size: 48px; font-weight: 650; letter-spacing: -1px; }
    .muted { fill: var(--cp-text-soft); }
    .accent { fill: var(--cp-accent); }
    .panel { fill: var(--cp-surface); stroke: var(--cp-border); stroke-width: 2; }
    .panel-heading { font-size: 29px; font-weight: 650; }
    .role-shell { fill: var(--cp-surface); stroke: var(--cp-accent); stroke-width: 2.5; }
    .role-heading { fill: var(--cp-accent-soft); }
    .role-divider { stroke: var(--cp-accent); stroke-opacity: .25; stroke-width: 1.5; }
    .guidance { fill: var(--cp-surface-soft); }
    .member { fill: var(--cp-accent-soft); stroke: var(--cp-accent); stroke-opacity: .45; stroke-width: 1.5; }
    .node { fill: var(--cp-surface); stroke: var(--cp-border); stroke-width: 2; }
    .quiet-role { fill: var(--cp-bg-elevated); stroke: var(--cp-border); stroke-width: 2; }
    .edge { fill: none; stroke: var(--cp-border); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .active-edge { fill: none; stroke: var(--cp-accent); stroke-width: 3.5; stroke-linecap: round; }
    .composition-arrow { fill: none; stroke: var(--cp-border-strong); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .center { text-anchor: middle; }
  </style>
  <title id="cover-title">contexture-mcp — An application-layer framework for MCP services and AI-native applications.</title>
  <desc id="cover-description">Two complementary views, not a before-and-after comparison. Left: a Role contains local guidance, Skill procedures, Tool actions, and a Child Role with the same recursive structure. Right: an application capability graph expands three Role levels, with Skills and Tools at multiple levels and a branch highlighted for on-demand disclosure. Lines show containment, not execution order or inheritance.</desc>
  <rect class="canvas" width="1600" height="900"/>
  <rect class="brand-rule" x="96" y="66" width="8" height="42" rx="4"/>
  <text x="124" y="99" font-size="36" font-weight="650">contexture-mcp</text>
  <text x="96" y="193" class="headline">An application-layer framework</text>
  <text x="96" y="256" class="headline">for MCP services and AI-native applications.</text>
  <text x="99" y="310" font-size="34" font-weight="600" class="accent">One model for application structure and agent interaction.</text>

