    <g data-within="graph-parent-role">
      <text x="1107" y="511" font-size="27" font-weight="650" class="center accent">Role</text>
      <text x="1107" y="545" font-size="20" class="center muted">Local guidance</text>
    </g>
    <rect class="quiet-role" x="1320" y="483" width="134" height="64" rx="10"/>
    <text x="1387" y="523" font-size="26" class="center muted">Role</text>

    <path class="edge" d="M1107 555v15H816v19m153-19v19"/>
