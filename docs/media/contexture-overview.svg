    <text x="1006" y="735" font-size="24" font-weight="600" class="center accent">Skill</text>
    <text x="1171" y="735" font-size="24" font-weight="600" class="center accent">Tool</text>
    <rect class="quiet-role" x="1280" y="705" width="180" height="44" rx="8"/>
    <text x="1370" y="735" font-size="23" class="center muted">Child Role…</text>
    <path class="edge" stroke-dasharray="3 5" d="M1370 749v25"/>
    <text x="1087" y="781" font-size="23" font-weight="600" class="center accent">Disclose on demand</text>
